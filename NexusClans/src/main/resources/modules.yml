# Включение и отключение любых модулей плагина (можно переключать и прямо в игре через /nexusclans module <модуль> <on/off>)
modules:
  money-points-system: true       # Начисление/снятие очков клана за вклады в казну (/c donate) и снятия (/c take) по 10 000$
  smart-points-system: true       # Умная система очков за ивенты (AirDrop, NexusChest, TOPKA), Шахту, Лесопилку и уникальные ПвП-киллы
  clan-wars-arena: true           # Система клановых битв 5 на 5 (/c war, /war)
  glowing-packets: true           # Индивидуальная подсветка соклановцев (зеленым) и союзников (желтым) через ProtocolLib
  head-riding: true               # Система посадки на голову соклановцев и союзников + бросок по направлению взгляда
  virtual-clan-chest: true        # Виртуальный двойной сундук клана (/c chest) с подписью того, кто положил предмет
  alliances: true                 # Система союзов между кланами (/c team, до 2 союзников)
  top-signs-and-hopper: true      # Таблички Топ-1/2/3 и меню-воронка с головами лидеров
  top-scoreboard-regions: true    # Скорборд Топ-10 кланов в выделенных регионах