messages:
  no-permission: "&c[NexusClans] У вас нет прав администратора!"
  reload-success: "&a[NexusClans] Все 12 конфигураций и 5 баз данных успешно перезагружены!"
  module-toggled: "&a[NexusClans] Модуль &e{module} &aпереключен в состояние: {state}"
  sign-set: "&a[NexusClans] Табличка кланового топа &e#{rank} &aуспешно установлена и обновлена!"
  look-at-sign: "&c[NexusClans] Посмотрите вплотную на табличку!"
  region-added: "&a[NexusClans] Регион скорборда Топ-10 кланов &e{region} &aдобавлен!"
  region-removed: "&e[NexusClans] Регион скорборда &6{region} &eудален!"
  no-worldedit: "&c[NexusClans] Сначала выделите территорию топориком WorldEdit (//wand)!"
  spectator-point-set: "&a[NexusClans] Точка появления наблюдателей (/war spectate) установлена!"
  war-arena-region-set: "&a[NexusClans] Регион боевой арены (и слепок блоков для регенерации) успешно сохранен!"
  clan-spawn-added: "&a[NexusClans] Точка спавна &e#{index}/5 &aдля &6Клан-{team} &aустановлена!"
  clan-spawn-limit: "&c[NexusClans] Для Клан-{team} уже установлено максимум 5 точек! Используйте /nexusclans clearpoints."
  points-cleared: "&e[NexusClans] Стартовые точки бойцов на арене очищены."
  admin-points-changed: "&a[NexusClans] Очки клана &e{clan} &aизменены! Текущие очки: &e{points}"
  admin-balance-changed: "&a[NexusClans] Баланс казны клана &e{clan} &aустановлен на &e{balance}$"
  admin-clan-deleted: "&c[NexusClans] Клан &e{clan} &cпринудительно удален администратором!"

  help:
    - "&4&l=== Панель Администратора NexusClans (/nexusclans) ==="
    - "&c/nexusclans settab1 / settab2 / settab3 &7- Установить табличку Топ-1/2/3 клана"
    - "&c/nexusclans addrg <Название> / removerg <Название> &7- Регион скорборда Топ-10 кланов"
    - "&c/nexusclans setwarregion &7- Сохранить регион и блоки арены 5x5 для авто-регенерации"
    - "&c/nexusclans setspectatorpoint &7- Установить точку для /war spectate"
    - "&c/nexusclans addclan1point / addclan2point &7- Добавить точку спавна бойца (до 5 шт.)"
    - "&c/nexusclans clearpoints &7- Очистить точки спавна бойцов Клан-1 и Клан-2"
    - "&c/nexusclans module <Модуль> <on/off> &7- Вкл/Выкл любой модуль плагина на лету"
    - "&c/nexusclans givepoints <Клан> <Очки> &7- Выдать/снять очки клану"
    - "&c/nexusclans setbalance <Клан> <Сумма> &7- Установить баланс казны клана"
    - "&c/nexusclans deleteclan <Клан> &7- Принудительно удалить любой клан"
    - "&c/nexusclans reload &7- Перезагрузить все конфиги и базы"