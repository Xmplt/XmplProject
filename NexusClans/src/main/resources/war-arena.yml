settings:
  team-size: 5
  min-bet-amount: 1000.0
  # Время на сбор своей команды (/c warmembers) и отправку вызова — 5 минут (300 сек)
  roster-assembly-timeout-seconds: 300
  # Время на принятие вызова вторым кланом — 120 секунд
  invite-expire-seconds: 120
  # Время второму клану на сбор состава (/c warmembers) после принятия вызова — 10 минут (600 сек)
  opponent-roster-timeout-seconds: 600
  # Время на подготовку инвентарей и ввод /clan pvpready — 10 минут (600 сек)
  inventory-prep-seconds: 600
  # Время полной блокировки инвентаря перед телепортацией на арену — 3 минуты (180 сек)
  inventory-lock-countdown-seconds: 180
  # Время в барьерных капсулах на точках арены перед снятием барьеров — 1 минута (60 сек)
  cage-countdown-seconds: 60
  # Максимальная длительность самой битвы — 30 минут (1800 сек)
  battle-max-duration-seconds: 1800
  # Время победителям на сбор лута после смерти всех врагов — 2 минуты (120 сек)
  winner-loot-collection-seconds: 120
  # Кулдаун на участие в следующей клановой войне для обоих кланов — 1 день (86400 сек)
  clan-war-cooldown-seconds: 86400
  # Интервал напоминания спектаторам о команде /war leave (150 секунд = 2.5 минуты)
  spectator-reminder-interval-seconds: 150

points-distribution:
  # Сколько всего очков списывается с проигравших участников и начисляется победителям
  total-war-points-pool: 100
  # Веса списания очков у проигравших по порядку смерти (1-й умерший теряет больше всех, 5-й — меньше всех; в сумме 100)
  loser-death-order-penalties: [26, 23, 20, 17, 14]
  # Базовые веса начисления очков победителям от большего числа киллов к меньшему (в сумме 100)
  winner-kill-rank-rewards: [28, 23, 20, 16, 13]

commands-whitelist:
  # Разрешенные команды для бойцов ВО ВРЕМЯ активной битвы
  during-battle:
    - "/l"
    - "/login"
    - "/msg"
    - "/r"
  # Разрешенные команды для победителей во время 2-минутного сбора лута после победы
  during-winner-loot:
    - "/home"
    - "/homes"
    - "/spawn"
    - "/c"
    - "/clan"
    - "/tp"
    - "/warp"

# Координаты арены, точки спектаторов и до 5 точек спавна для Клан-1 и Клан-2 (заполняются командами /nexusclans)
arena: {}