mechanics:
  # Сколько раз подряд можно плюнуть БЕЗ кулдауна
  burst-shots-before-cooldown: 4
  # Время восстановления горла после 4 плевков подряд (в секундах)
  cooldown-seconds: 15

  # Радиус слышимости звука плевка для окружающих игроков
  sound-radius: 15.0

  # Настройка полета снаряда ламы:
  initial-speed: 1.35           # Начальная скорость полета вперед
  straight-flight-ticks: 7      # Сколько тиков летит идеально прямо
  gravity-drop-per-tick: 0.045  # С какой скоростью начинает снижаться вниз после прямого участка
  max-flight-ticks: 60          # Максимальное время жизни снаряда в воздухе

  # Сколько тиков частицы плевка остаются лежать и искрить на земле после падения (60 тиков = 3 сек)
  ground-effect-ticks: 60

  # Минимальный урон при попадании плевком в игрока (0.5 = четверть сердца)
  hit-damage: 0.5

gui:
  title: "&8Выбор эффекта плевка"
  size: 27
  # Кнопки пагинации (появляются АВТОМАТИЧЕСКИ только если в списке ниже есть плевки со страницей page: 2 и более!)
  prev-page-slot: 18
  prev-page-name: "&e← Предыдущая страница"
  next-page-slot: 26
  next-page-name: "&eСледующая страница →"

  status-lore:
    selected: "&a✔ Выбрано"
    unlocked: "&eНажмите, чтобы выбрать!"
    locked: "&c✖ Заблокировано (Выбивается из кейсов)"

messages:
  cooldown: "&cУ вас пересохло в горле, подождите немного! ({time} сек.)"
  spit-launch: "&eВы плюнули перед собой!"
  spit-hit-shooter: "&eВы попали плевком в игрока {target}!"
  spit-hit-victim: "&eВ вас плюнул игрок {shooter}!"
  style-selected: "&eВы выбрали стиль плевка: {style}&e!"
  style-locked: "&cЭтот эффект плевка у вас еще не открыт!"

# Каталог плевков (можно добавлять сколько угодно и раскидывать по страницам page: 1, 2, 3...)
