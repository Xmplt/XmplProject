mechanics:
  # Радиус в блоках, в котором ВСЕ игроки вокруг услышат звук пробития/поломки щита
  broadcast-radius: 22.0

  # Пробивать ли щит при ударе любым топором (_AXE), когда игрок зажал ПКМ (блокирует щитом)
  disable-shield-on-axe-hit: true

  # Длительность перезарядки (стана) пробитого щита в тиках (100 тиков = 5 секунд, стандарт Minecraft)
  shield-cooldown-ticks: 100

  # Срабатывать ли также при полной поломке щита по прочности (когда предмет щита исчезает)
  trigger-on-item-durability-break: true

  # Игнорировать ли удары в регионах, где выключено ПвП (если ивент отменен WorldGuard'ом)
  respect-cancelled-damage: true

  # Список типов топоров, которые пробивают щит
  axe-materials:
    - "DIAMOND_AXE"
    - "IRON_AXE"
    - "GOLD_AXE"
    - "STONE_AXE"
    - "WOOD_AXE"