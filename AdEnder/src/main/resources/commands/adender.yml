messages:
  no-permission: "&c[Порталы] У вас недостаточно прав!"

  # 1. Если игрок находится в Аду или Энде
  wrong-world-dimension: "&c[Порталы] Телепортация к порталам доступна только в обычном мире!"

  # 2. Если игрок находится НЕ в регионе spawn1
  not-in-spawn-region: "&c[Порталы] Телепортироваться к порталу ({portal}) можно только со спавна!"

  # 3. Если у игрока не хватает 500$
  not-enough-money: "&c[Порталы] У вас недостаточно средств для телепортации к порталу ({portal})! Необходимо: &e{cost}$ &c(Ваш баланс: &e{balance}$&c)."

  # 4. Если админ еще не установил точку телепорта
  point-not-set: "&c[Порталы] Точка телепортации к порталу ({portal}) еще не установлена администратором!"

  # 5. При успешном телепорте — ПОЛНОСТЬЮ ярко-зеленым цветом!
  teleport-success: "&a&lВы успешно телепортировались к порталу ({portal})! С вас списано {cost}$."
  teleport-success-free: "&a&lВы успешно телепортировались к порталу ({portal})!"

  # Сообщения для администратора (/adender)
  set-ad-success: "&a[AdEnder] Точка телепортации к порталу в Ад успешно установлена (координаты и взгляд сохранены)!"
  set-ender-success: "&a[AdEnder] Точка телепортации к порталу в Энд успешно установлена (координаты и взгляд сохранены)!"
  reload-success: "&a[AdEnder] Все конфигурации и точки телепортации успешно перезагружены!"

  help-admin:
    - "&5&l=== Управление Порталами (AdEnder) ==="
    - "&d/ad &7- Телепортироваться к порталу в Ад"
    - "&d/ender &7- Телепортироваться к порталу в Энд"
    - "&d/adender setad &7- Установить точку к порталу в Ад (с направлением взгляда)"
    - "&d/adender setender &7- Установить точку к порталу в Энд (с направлением взгляда)"
    - "&d/adender reload &7- Перезагрузить все конфиги"