settings:
  # Количество игроков на одной странице в чате (/kills [страница])
  entries-per-page: 10

messages:
  header:
    - "&8&m--------------------------------------------"
    - "&6&lТоп убийц сервера &7(Страница &e{page}&7/&e{max_pages}&7):"
  # Формат строки: Ник - Убийств (зеленым) Смертей (красным)
  entry-format: "&e#{rank} &f{player} &8- &fУбийств: &a{kills} &fСмертей: &c{deaths}"
  empty-top: "&cВ топе убийц пока никого нет."
  invalid-page: "&cСтраница &e{page} &cне найдена! Всего страниц: &e{max_pages}&c."
  footer:
    - "&7Следующая страница: &e/kills {next_page}"
    - "&8&m--------------------------------------------"
  footer-last-page:
    - "&8&m--------------------------------------------"