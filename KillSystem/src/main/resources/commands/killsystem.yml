  help-admin:
    - "&4&l=== Управление KillSystem ==="
    - "&c/kills [Страница] &7- Посмотреть топ убийц в чате"
    - "&c/killsystem addtab<Номер> &7- Привязать табличку под взглядом к месту в топе (например addtab1 или addtab100)"
    - "&c/killsystem removetab &7- Отвязать табличку, на которую вы смотрите"
    - "&c/killsystem update &7- Принудительно обновить все таблички сейчас"
    - "&c/killsystem reload &7- Перезагрузить все конфиги"