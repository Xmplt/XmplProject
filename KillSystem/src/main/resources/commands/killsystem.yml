messages:
  no-permission: "&c[KillSystem] У вас нет прав!"
  look-at-sign: "&c[KillSystem] Посмотрите вплотную на табличку, которую хотите сделать топом!"
  invalid-rank-number: "&c[KillSystem] Укажите корректный номер места (например: /killsystem addtab1 или /killsystem addtab100)!"
  sign-added: "&a[KillSystem] Табличка для &eТоп-{rank} &aпо убийствам успешно установлена и обновлена!"
