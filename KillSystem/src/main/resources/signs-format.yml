# Формат строк на табличке, когда игрок на этом месте топа существует:
active-sign:
  line-1: "&0{player}"
  line-2: "&0Убийств: &a{kills}"
  line-3: "&0Смертей: &c{deaths}"
  line-4: ""

# Формат строк на табличке, если на этом месте (например топ-100) еще никого нет:
empty-sign:
  line-1: "&0Пусто #{rank}"
  line-2: "&0Убийств: &a0"
  line-3: "&0Смертей: &c0"
  line-4: ""