teleport-rules:
  # Если игрок вводит команду спавна (/spawn) и телепортируется на спавн — метка СНИМАЕТСЯ сразу
  clear-mark-on-spawn-command: true

  # Список команд, которые считаются прямой телепортацией на спавн (снимают метку при телепорте)
  spawn-commands:
    - "/spawn"
    - "/espawn"
    - "/essentials:spawn"

  # Время (в миллисекундах), в течение которого после ввода /spawn срабатывание PlayerTeleportEvent считается именно командой /spawn
  spawn-command-grace-ms: 1500

  # При любой другой телепортации (например /warp shop, /tp, эндер-жемчуг):
  # - Если точка назначения внутри мирного региона спавна (safe-spawn-region) -> метка ОСТАЕТСЯ на 20 секунд!
  # - Если точка назначения за пределами спавна (в диком мире) -> метка СНИМАЕТСЯ!