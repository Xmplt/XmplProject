# Сообщение при выходе из мирного спавна за красную линию (пишется только при наложении метки и с учетом кулдауна!)
leave-safe-spawn: "&8Вы покинули зону спавна! Даже если вы вернетесь, вас могут бить еще %time% секунд."

# Уведомление, когда 20 секунд на спавне истекли и игрок снова в безопасности (оставь "", если не нужно)
mark-expired-on-spawn: ""
# Уведомление в ActionBar (над хотбаром), пока тикают 20 секунд уязвимости внутри спавна
actionbar-countdown-enabled: false
actionbar-countdown: ""