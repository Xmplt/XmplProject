permissions:
  # Право администратора на управление (/redline)
  admin: "spawnredline.admin"
  # Право иммунитета (если включено ниже — админы в гм/ванише не получают метку)
  enable-bypass-permission: false
  bypass: "spawnredline.bypass"

mechanics:
  # Сколько секунд игрока можно бить после того, как он вернулся с боевой зоны обратно за красную линию на спавн
  vulnerability-seconds: 20

  # Кулдаун на сообщение о выходе за красную линию (в секундах), чтобы игроки не спамили себе чат, бегая туда-сюда
  message-cooldown-seconds: 5

  # Продлевать/обновлять ли 20 секунд, если двух помеченных игроков бьют прямо на спавне
  reset-timer-on-marked-hit: false

  # Разрешать ли также выстрелы из лука/удочки/снежков между двумя помеченными игроками внутри спавна
  allow-projectiles-between-marked: true