# Градация цвета суммы при продаже деревьев
sell-colors:
  '0': "&f"
  '100': "&e"
  '500': "&6"
  '1000': "&d"

# Титл на экране при продаже (/wood sell) — просто сумма с соответствующим цветом!
title:
  enabled: true
  main-title: "{color}&l+{amount}$"
  subtitle: "&aВы продали срубленные деревья ({total} шт.)"
  fade-in: 5
  stay: 45
  fade-out: 10