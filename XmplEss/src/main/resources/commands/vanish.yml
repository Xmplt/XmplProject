permissions:
  vanish-use: "xmpless.vanish.use"
  online-use: "xmpless.online"
  god-use: "xmpless.god"
  # Префикс уровней ваниша: xmpless.vanish.level.<число> (например xmpless.vanish.level.1 у хелпера, xmpless.vanish.level.10 у админа)
  # Можно создавать уровни до бесконечности (1..999999). Тот, у кого уровень >= уровню скрытого игрока, видит его!
  level-prefix: "xmpless.vanish.level."

# Постоянная надпись над хотбаром пока игрок в невидимости
actionbar-vanish: "&a&lВы в невидимости!"

messages:
  no-permission: "&cУ вас нет прав!"
  vanish-enabled: "&aРежим невидимости &2&lВКЛЮЧЕН&a! (Ваш уровень скрытности: &e{level}&a)"
  vanish-disabled: "&cРежим невидимости &4&lВЫКЛЮЧЕН&c!"

  # Режим бога, в котором нельзя бить обычными руками/оружием, а можно бить ТОЛЬКО палкой хелпера
  god-enabled: "&aРежим Бога &2&lВКЛЮЧЕН&a! (Бить игроков можно только Палкой Хелпера)"
  god-disabled: "&cРежим Бога &4&lВЫКЛЮЧЕН&c!"
  god-attack-blocked: "&cВ режиме Бога вы можете бить игроков только Палкой Хелпера!"

  # Команда /online (Точно по ТЗ: первая строка с жирной оранжевой цифрой, вторая строка — белые ники через запятую)
  online-header: "&fСейчас на сервере онлайн &6&l{count}&f:"
  online-list: "&f{players}"