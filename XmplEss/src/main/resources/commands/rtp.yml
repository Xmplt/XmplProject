permissions:
  use: "xmpless.rtp.use"
  near-players: "xmpless.rtp.players" # Право на телепорт ближе к игрокам (Око Эндера)

settings:
  spawn-region-name: "spawn"
  normal-rtp:
    max-distance-from-spawn: 900
    min-distance-from-spawn: 150
  player-rtp:
    max-distance-from-spawn: 2500
    # Телепортирует на расстоянии 280-285 блоков от найденного игрока, чтобы успеть прописать /near
    min-distance-from-target: 280
    max-distance-from-target: 285
    cost: 3000.0

gui:
  title: "&8Рандомная телепортация"
  size: 27
  normal-button:
    slot: 11 # Слева по центру
    material: "COMPASS"
    name: "&a&lОбычный телепорт"
    lore:
      - "&7Телепортация в случайное безопасное место"
      - "&7в радиусе &e900 блоков &7от спавна."
      - ""
      - "&7Стоимость: &aБесплатно"
      - "&eНажмите, чтобы телепортироваться!"
  player-button:
    slot: 15 # Справа по центру (Око Эндера)
    material: "EYE_OF_ENDER"
    name: "&d&lТелепорт ближе к игрокам"
    lore-has-perm:
      - "&7Телепортирует вас неподалеку от случайного"
      - "&7игрока (&f280-285 блоков&7) вне чужих регионов!"
      - ""
      - "&7Стоимость: &63000 монет"
      - "&eНажмите для поиска игрока!"
    lore-no-perm:
      - "&7Телепортирует вас неподалеку от случайного"
      - "&7игрока (&f280-285 блоков&7) вне чужих регионов!"
      - ""
      - "&c&lНедоступно!"
      - "&7Купите привилегию на сайте сервера,"
      - "&7чтобы получить доступ к этой функции!"

messages:
  no-permission: "&cУ вас нет прав на /rtp!"
  no-player-rtp-perm: "&cДля телепортации к игрокам необходимо приобрести привилегию!"
  not-enough-money: "&cУ вас недостаточно средств! Требуется: &6{cost} монет&c."
  no-targets-online: "&cСейчас на сервере нет подходящих игроков в дикой местности!"
  searching-location: "&eПоиск безопасной локации без приватов и шахт..."
  teleport-normal-success: "&aВы успешно телепортированы на координаты &e{x}, {y}, {z}&a!"
  teleport-player-success: "&dВы телепортированы неподалеку от игрока! Списано: &6{cost} монет&d. Введите &e/near&d!"
  search-failed: "&cНе удалось найти безопасную точку. Попробуйте еще раз!"