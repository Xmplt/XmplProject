permissions:
  # Право администратора на /nchest (редактор лута, установка сундуков, региона, спавна и точек)
  admin: "nexuschest.admin"

schedule:
  # Интервал между ивентами в секундах (7200 секунд = 2 часа)
  interval-seconds: 7200

  # Длительность самого ивента в секундах (300 секунд = 5 минут)
  active-duration-seconds: 300

  # За сколько секунд до начала вызывать событие NexusChestPreStartEvent (для будущей платной подписки)
  pre-start-notify-seconds: 60

  # Интервал повторного напоминания 4-значного кода в чат во время ивента (30 секунд)
  code-broadcast-interval-seconds: 30

  # Минимальный онлайн на сервере, чтобы таймер до начала ивента шел.
  # Если онлайн падает ниже этого числа — таймер СТАВИТСЯ НА ПАУЗУ (не сбрасываясь!) и продолжает идти при наборе онлайна!
  min-online-players: 2

  # Как часто авто-сохранять оставшиеся секунды таймера в БД на случай внезапного рестарта (в секундах)
  save-timer-state-interval-seconds: 10

security:
  # Выкидывать ли на спавн любого игрока (кроме админа в креативе), который попал в регион NexusChest читом или без ввода кода
  strict-region-kick-to-spawn: true

  # Разрешить ли принудительно ПвП между всеми участниками внутри региона NexusChest (даже если он находится внутри спавна!)
  force-enable-pvp-in-region: true

  # Белый список команд, которые РАЗРЕШЕНО писать игроку, когда он находится на ивенте NexusChest (например чтобы уйти домой)
  allowed-commands-for-participants:
    - "/home"
    - "/homes"
    - "/ehome"
    - "/spawn"
    - "/espawn"
    - "/nexuschest"

  # Команды телепортации (/tpa, /tpahere, /call и т.д.), при вводе которых проверит, не находится ли цель или сам игрок на NexusChest
  blocked-tp-commands-to-participant:
    - "/tpa"
    - "/etpa"
    - "/call"
    - "/ecall"
    - "/tpahere"
    - "/etpahere"
    - "/tpaccept"
    - "/etpaccept"
    - "/tpyes"
    - "/etpyes"