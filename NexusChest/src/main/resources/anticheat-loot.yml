loot-generation:
  # Сколько случайных предметов из пула (/nchest loot) спавнить в каждом из двух сундуков при старте ивента
  min-items-per-chest: 6
  max-items-per-chest: 12

  # Разбрасывать ли предметы по случайным слотам сундука (0..26)
  randomize-slots: true

# Умная защита от читов (ChestStealer / авто-кликер) при лутании сундуков:
# 1 предмет можно взять мгновенно. Если игрок берет предметы спокойно (с паузой >= min-interval-ms), кулдаун вообще не включается!
# Если же игрок пытается забрать сразу несколько предметов подряд быстрее чем за min-interval-ms —
# действие блокируется, и ТОЛЬКО У НЕГО в сундуке на 1 секунду появляется Красная Шерсть!
smart-cooldown:
  # Минимальная пауза между взятием двух предметов подряд (в миллисекундах, 650 мс = 0.65 сек)
  min-interval-between-takes-ms: 650

  # На сколько тиков показывать красную шерсть нарушителю (20 тиков = 1 секунда)
  red-wool-penalty-ticks: 20

  # Предмет красной шерсти (WOOL, data = 14)
  penalty-item:
    name: "&cПодождите..."
    lore:
      - "&7Не так быстро!"
      - "&7Предметы можно брать раз в секунду."