messages:
  no-permission: "&c[Шахта] У вас нет прав!"
  # Когда игрок достиг потолка по конкретной руде (например 70 редстоуна)
  ore-limit-reached: "&c[Шахта] &fДля руды &e{ore} &fне хватает места (&cмакс. {limit} шт.&f)! Попробуйте добыть другой вид руды или продайте накопленное: &a/mine sell"
  nothing-to-sell: "&c[Шахта] &fУ вас нет накопленной руды для продажи!"
  sell-success-chat: "&a[Шахта] &fВы успешно продали всю накопленную руду (&e{total_items} шт.&f) и получили {color}&l{amount}$&f!"

  # Сообщения управления регионами для админа
  no-worldedit-selection: "&c[Шахта] Сначала выделите территорию топориком WorldEdit (//wand)!"
  region-added: "&a[Шахта] Формальный регион шахты &e{region} &aуспешно создан и сохранен!"
  region-removed: "&e[Шахта] Регион шахты &6{region} &eбыл успешно удален!"
  region-not-found: "&c[Шахта] Регион с названием &e{region} &cне найден!"
  reload-success: "&a[Шахта] Все конфигурации и регионы MineSystem успешно перезагружены!"

  help-player:
    - "&6&l=== Помощь по Шахте ==="
    - "&e/mine sell &7- Продать всю накопленную руду"
  help-admin:
    - "&6&l=== Управление MineSystem ==="
    - "&e/mine sell &7- Продать всю накопленную руду"
    - "&e/mine addrg <Название> &7- Создать регион шахты по выделению WorldEdit"
    - "&e/mine removerg <Название> &7- Удалить регион шахты"
    - "&e/mine listrg &7- Список всех регионов шахты"
    - "&e/mine reload &7- Перезагрузить все конфиги"