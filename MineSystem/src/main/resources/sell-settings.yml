# Градация цвета суммы заработка в зависимости от того, сколько денег получил игрок за продажу
sell-colors:
  '0': "&f"
  '100': "&e"
  '1000': "&6"
  '5000': "&b"
  '10000': "&d"

# Большое уведомление на экране при продаже руды (/mine sell)
# {color} - автоматически подобранный цвет из sell-colors, {amount} - полученная сумма
title:
  enabled: true
  main-title: "&a&lРУДА ПРОДАНА!"
  subtitle: "&fВы получили: {color}&l+{amount}$"
  fade-in: 5
  stay: 45
  fade-out: 10