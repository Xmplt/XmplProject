pvp:
  # Процент от текущего баланса убитого игрока, который списывается и передается убийце
  steal-percent: 5.0

  # Максимальная сумма денег, которая может списаться у убитого игрока за одну смерть
  max-steal-amount: 20000.0

  # Минимальный баланс жертвы, при котором происходит списание (если у жертвы меньше — ничего не спишется)
  min-victim-balance: 20.0

  # Защита от перелива денег с твинков (одинаковый IP-адрес)
  prevent-same-ip-abuse: true

  # Право иммунитета (если оно есть у игрока, при смерти он не теряет деньги — выдавать только при необходимости)
  keep-money-permission: "moneydrop.pvp.keep"