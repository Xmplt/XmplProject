aliases:
  - "reputation"

messages:
  no-permission: "&cУ вас нет прав на использование этой команды!"

  # Когда игрок впервые ставит лайк или дизлайк
  like-success: "&aВы лайкнули игрока %player%! (+1 к репутации)"
  dislike-success: "&cВы дизлайкнули игрока %player%! (-1 к репутации)"

  # Когда игрок МЕНЯЕТ свою прошлую оценку (например был лайк -> ставит дизлайк: лайк отнимается и еще -1 добавляется!)
  changed-to-like: "&aВы изменили свою оценку игроку %player% с дизлайка на лайк! (+2 к репутации)"
  changed-to-dislike: "&cВы изменили свою оценку игроку %player% с лайка на дизлайк! (-2 к репутации)"

  # Уведомления тому, кому поставили оценку
  got-like: "&aВам поставил лайк игрок %player%!"
  got-dislike: "&cВам поставил дизлайк игрок %player%!"
  got-changed-to-like: "&aИгрок %player% изменил свою оценку вам на лайк!"
  got-changed-to-dislike: "&cИгрок %player% изменил свою оценку вам на дизлайк!"

  # Ошибки и проверки
  already-voted: "&cВы уже оценивали этого игрока!"
  self-vote: "&cНельзя оценивать самого себя!"
  cooldown: "&cПодождите еще %time% мин. перед следующим голосованием."
  player-not-found: "&cИгрок не найден."

  # Сообщение при просмотре /rep или /rep <Ник>
  # %amount% - чистое число, %badge% - формат в скобочках (&7(&a&l+10&7))
  balance: "&fРепутация игрока &e%player%: &6%amount%"
  reload-success: "&a[ReputationSystem] Все конфигурации успешно перезагружены!"