# Шансы количества одновременных ограничений (в сумме 100%):
# 3 запрета одновременно = 15%
# 2 запрета одновременно = 35%
# 1 запрет               = 45%
# 0 запретов             = 5% (остаток)
chances:
  three-restrictions: 15.0
  two-restrictions: 35.0
  one-restriction: 45.0

# Отображение статусов в чате (Разрешено — зеленым, Запрещено — красным)
status-tags:
  allowed: "&aРазрешено"
  denied: "&cЗапрещено"

# Сообщения при попытке использовать запрещенный предмет в мире, где сейчас находится сундук
blocked-messages:
  elytra: "&cЭлитры запрещены уважаемым сундуком!"
  pearl: "&cЖемчуг запрещен уважаемым сундуком!"
  chorus: "&cХорус запрещен уважаемым сундуком!"