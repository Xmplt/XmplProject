# За 5 минут до появления сундука — СПЕЦИАЛЬНО ДЛЯ ВЛАДЕЛЬЦЕВ ПОДПИСКИ (показывает точные координаты и запреты заранее!)
spawn-warning-subscriber:
  - "&aСундук по координатам появится через {time}! &aМир: {world} &aКоординаты: &e{x}, {y}, {z}&a."
  - "&aОграничения: &aЭлитры: {elytra}&a, &aЖемчуг: {pearl}&a, &aХорус: {chorus}&a."

# Огромный Тайтл на экран при спавне сундука
spawned-title: "&a&lСУНДУК ПО КООРДИНАТАМ ПОЯВИСЯ!"
spawned-subtitle: "&fКоординаты в чате"
title-fade-in: 5
title-stay: 65
title-fade-out: 15

# Сообщение в чат при спавне сундука
spawned-chat:
  - "&aСундук по координатам появился! &aМир: {world} &aКоординаты: &a{x}, {y}, {z}."
  - "&aОграничения: &aЭлитры: {elytra}&a, &aЖемчуг: {pearl}&a, &aХорус: {chorus}&a."

# Напоминание каждую минуту, пока сундук стоит и ждет активации (до 10 минут)
waiting-reminder:
  - "&aСундук ожидает активации! &aКоординаты: &a{x}, {y}, {z} &a({world})"
  - "&aЭлитры: {elytra}&a, &aПерлы: {pearl}&a, &aХорус: {chorus}"

activated-chat: "&aСундук по координатам был активирован игроком &e{player}&a! Открытие через &e{time}&a."
