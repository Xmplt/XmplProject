messages:
  no-permission: "&c[Topka] У вас нет прав администратора!"
  look-at-chest: "&c[Topka] Посмотрите вплотную на сундук (CHEST или TRAPPED_CHEST)!"
  chest-set: "&a[Topka] Рабочий сундук &e#{number} &aустановлен на &f{x}, {y}, {z}&a! Голограмма привязана к сундуку."
  chest2-removed: "&e[Topka] Второй сундук отключен. Теперь работает только 1 сундук (без #1/#2)."
  holo-set: "&a[Topka] Точка голограммы &e#{number} &aустановлена на вашей позиции!"
  no-worldedit: "&c[Topka] Сначала выделите территорию топориком WorldEdit (//wand)!"
  region-set: "&a[Topka] PvP-регион Топки успешно сохранен!"
  vote-block-set: "&a[Topka] Изумрудный блок и голограмма голосования установлены на вашей позиции!"
  loot-editor-title: "&8Пул предметов TOPKA (27 слотов)"
  loot-saved: "&a[Topka] Пул предметов сохранен ({count} стаков)! Всем предметам выдан лор TOPKA."
  terra-added: "&a[Topka] Территория {display} &7(ID: &e{id}&7, блоков: &f{blocks}&7) &aуспешно сохранена!"
  terra-not-found: "&c[Topka] Территория &e{id} &cне найдена!"
  terra-pasted: "&a[Topka] Территория {display} &aпринудительно установлена на арену!"
  force-started: "&a[Topka] Принудительно запущено наполнение сундука!"
  reload-success: "&a[Topka] Все конфигурации Topka успешно перезагружены!"
  killme-only-in-region: "&cКоманду /killme можно использовать только внутри PvP зоны Топки!"
  killme-used: "&cВы использовали /killme на PvP арене."

  help:
    - "&6&l=== Управление ивентом TOPKA (/topka) ==="
    - "&e/topka setchest1 &7(или &e/topka setchest&7) - Выбрать рабочий сундук #1 и привязать к нему голограмму"
    - "&e/topka setchest2 &7- Выбрать второй рабочий сундук #2"
    - "&e/topka removechest2 &7- Убрать второй сундук (оставить только один)"
    - "&e/topka setholo1 / setholo2 &7- Перенести голограмму сундука #1/#2 на свою точку (опционально)"
    - "&e/topka setvote &7- Поставить изумрудный блок и голограмму «Голосуй за территорию»"
    - "&e/topka setregion &7- Установить PvP зону по выделению WorldEdit (или впиши регион WG в region-rules.yml)"
    - "&e/topka loot &7- Открыть GUI пула предметов (27 слотов, маленький сундук)"
    - "&e/topka addterra <Название> &7- Сохранить выделенную WorldEdit территорию в пул"
    - "&e/topka setterra <ID> &7- Принудительно поставить территорию"
    - "&e/topka start &7- Принудительно запустить наполнение сундука"
    - "&e/topka status &7- Текущий статус таймера, стадии и сундуков"
    - "&e/topka reload &7- Перезагрузить все конфиги"