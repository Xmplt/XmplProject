# Система редкости и цветов веса:
# chance - шанс выпадения этой весовой категории
# min-percent и max-percent - процент от максимального веса данного вида рыбы (от 0.0 до 1.0)
# color - цвет веса в лоре (всегда жирный, самая тяжелая — ТЕМНО-КРАСНАЯ &4&l)

weight-tiers:
  COMMON:
    chance: 58.0          # 58% — Мелкая рыба (от 0% до 15% макс. веса вида)
    min-percent: 0.00
    max-percent: 0.15
    color: "&e&l"
  UNCOMMON:
    chance: 26.0          # 26% — Средняя рыба (от 15% до 35% макс. веса вида)
    min-percent: 0.15
    max-percent: 0.35
    color: "&a&l"
  RARE:
    chance: 11.0          # 11% — Крупная рыба (от 35% до 55% макс. веса вида)
    min-percent: 0.35
    max-percent: 0.55
    color: "&6&l"
  EPIC:
    chance: 3.8           # 3.8% — Редкая большая рыба (от 55% до 75% макс. веса вида)
    min-percent: 0.55
    max-percent: 0.75
    color: "&c&l"
  LEGENDARY:
    chance: 1.0           # 1.0% — Очень редкая рыба (от 75% до 90% макс. веса вида)
    min-percent: 0.75
    max-percent: 0.90
    color: "&d&l"
  MYTHIC:
    chance: 0.15          # 0.15% — Безумно редкая (от 90% до 96% макс. веса вида)
    min-percent: 0.90
    max-percent: 0.96
    color: "&5&l"
  TROPHEY_GOD:
    chance: 0.05          # 0.05% (ОЧЕНЬ РЕДКИЙ ТРОФЕЙ!) — Гигант на пределе веса (от 96% до 100%)
    min-percent: 0.96
    max-percent: 1.00
    color: "&4&l"         # Темно-красный жирный цвет!